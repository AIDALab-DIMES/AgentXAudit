[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-audit-prototype"
version = "0.1.0"
description = "Prototype LangGraph framework for auditing fixed tabular XAI explanations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0.0",
  "langgraph>=0.6.0",
  "langchain-openai>=0.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "torch>=2.3.0",
  "ucimlrepo>=0.0.7",
  "shap>=0.46.0",
  "lime>=0.2.0.1",
  "anchor-exp>=0.0.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
